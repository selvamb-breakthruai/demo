apiVersion: apps/v1
kind: Deployment

metadata:
  name: crud-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: crud-app

  template:
    metadata:
      labels:
        app: crud-app

    spec:
      containers:
      - name: crud-app
        image: demo-app

        imagePullPolicy: Never

        ports:
        - containerPort: 3000